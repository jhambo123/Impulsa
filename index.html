<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impulsa — Market News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ========== FILTER SETUP PAGE ========== -->
  <div id="filterPage" class="page active">
    <div class="container">
      <h1 class="logo-text">Impulsa</h1>
      <p class="subheading">Select your market categories</p>

      <!-- Market Categories Dropdown -->
      <div class="dropdown-box">
        <button class="dropdown-btn" id="marketDropdown">
          Market Categories ▼
        </button>
        <div class="dropdown-content" id="marketContent">
          <label><input type="checkbox" class="market-check" value="Indices"> 📊 Indices</label>
          <label><input type="checkbox" class="market-check" value="Forex"> 💱 Forex</label>
          <label><input type="checkbox" class="market-check" value="Commodities"> ⛏️ Commodities</label>
          <label><input type="checkbox" class="market-check" value="Crypto"> ₿ Crypto</label>
          <label><input type="checkbox" class="market-check" value="Stocks"> 📈 Stocks</label>
          <label><input type="checkbox" class="market-check" value="Bonds"> 📜 Bonds</label>
          <label><input type="checkbox" class="market-check" value="ETFs"> 📦 ETFs</label>
        </div>
      </div>

      <!-- Impact Level Dropdown -->
      <div class="dropdown-box">
        <button class="dropdown-btn" id="impactDropdown">
          Minimum Impact Level ▼
        </button>
        <div class="dropdown-content" id="impactContent">
          <label><input type="radio" name="impact" value="7"> ⭐ 7 & above</label>
          <label><input type="radio" name="impact" value="8"> ⭐ 8 & above</label>
          <label><input type="radio" name="impact" value="9"> ⭐ 9 & above</label>
          <label><input type="radio" name="impact" value="10"> ⭐ Only 10</label>
        </div>
      </div>

      <!-- Continue Button -->
      <button class="continue-btn" id="continueBtn">Continue</button>
    </div>
  </div>

  <!-- ========== HOME SCREEN ========== -->
  <div id="homePage" class="page">
    <header class="topbar">
      <h1 class="logo-text">Impulsa</h1>
      <button class="settings-btn" id="settingsBtn">⚙️</button>
    </header>

    <div class="container">
      <p class="subheading">Live News Feed</p>
      <div id="newsFeed" class="news-feed">
        <div class="empty-state">News will appear here once live...</div>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
