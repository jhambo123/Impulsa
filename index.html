<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Impulsa</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

  <!-- PAGE 1: FILTER SETUP -->
  <div id="setupPage" class="page active">
    <div class="setup-container">
      <h1 class="logo">Impulsa</h1>
      <p class="subtext">Set your preferences</p>

      <!-- PULL-DOWN FILTERS -->
      <div class="dropdown-section">
        <button class="dropdown-toggle" id="marketsToggle">
          Markets <span class="arrow">▼</span>
        </button>
        <div class="dropdown-content" id="marketsDropdown">
          <label class="check-item">
            <input type="checkbox" name="market" value="Indices" checked> Indices
          </label>
          <label class="check-item">
            <input type="checkbox" name="market" value="Forex" checked> Forex
          </label>
          <label class="check-item">
            <input type="checkbox" name="market" value="Crypto" checked> Crypto
          </label>
          <label class="check-item">
            <input type="checkbox" name="market" value="Commodities" checked> Commodities
          </label>
          <label class="check-item">
            <input type="checkbox" name="market" value="Economic" checked> Economic
          </label>
          <label class="check-item">
            <input type="checkbox" name="market" value="Bonds" checked> Bonds
          </label>
        </div>
      </div>

      <div class="dropdown-section">
        <button class="dropdown-toggle" id="impactToggle">
          Minimum Impact <span class="arrow">▼</span>
        </button>
        <div class="dropdown-content" id="impactDropdown">
          <div class="slider-wrap">
            <input type="range" id="impactSlider" min="1" max="10" value="5" class="slider">
            <div class="slider-val"><span id="impactVal">5</span> / 10 ⭐</div>
          </div>
        </div>
      </div>

      <div class="dropdown-section">
        <button class="dropdown-toggle" id="notifToggle">
          Notifications <span class="arrow">▼</span>
        </button>
        <div class="dropdown-content" id="notifDropdown">
          <label class="toggle-item">
            <input type="checkbox" id="notifCheck" checked> Enable Alerts
          </label>
        </div>
      </div>

      <!-- BIG ORANGE CONTINUE — BOTTOM LEFT -->
      <button id="continueBtn" class="continue-btn">Continue →</button>
    </div>
  </div>

  <!-- PAGE 2: HOME SCREEN (LOCKED) -->
  <div id="homePage" class="page">
    <header class="home-header">
      <h1>Impulsa</h1>
      <div class="header-right">
        <span id="clock" class="clock"></span>
        <button id="settingsBtn" class="settings-btn">⚙️</button>
      </div>
    </header>
    <div id="newsFeed" class="news-feed"></div>
    <button id="refreshBtn" class="refresh-btn">↻ Refresh</button>
  </div>

  <!-- PAGE 3: SETTINGS -->
  <div id="settingsPage" class="page">
    <div class="setup-container">
      <div class="settings-top">
        <h2>Settings</h2>
        <button id="backBtn" class="back-btn">← Back</button>
      </div>

      <div class="dropdown-section">
        <button class="dropdown-toggle" id="s_marketsToggle">
          Markets <span class="arrow">▼</span>
        </button>
        <div class="dropdown-content" id="s_marketsDropdown">
          <label class="check-item">
            <input type="checkbox" id="s_Indices"> Indices
          </label>
          <label class="check-item">
            <input type="checkbox" id="s_Forex"> Forex
          </label>
          <label class="check-item">
            <input type="checkbox" id="s_Crypto"> Crypto
          </label>
          <label class="check-item">
            <input type="checkbox" id="s_Commodities"> Commodities
          </label>
          <label class="check-item">
            <input type="checkbox" id="s_Economic"> Economic
          </label>
          <label class="check-item">
            <input type="checkbox" id="s_Bonds"> Bonds
          </label>
        </div>
      </div>

      <div class="dropdown-section">
        <button class="dropdown-toggle" id="s_impactToggle">
          Minimum Impact <span class="arrow">▼</span>
        </button>
        <div class="dropdown-content" id="s_impactDropdown">
          <div class="slider-wrap">
            <input type="range" id="s_impactSlider" min="1" max="10" value="5" class="slider">
            <div class="slider-val"><span id="s_impactVal">5</span> / 10 ⭐</div>
          </div>
        </div>
      </div>

      <div class="dropdown-section">
        <button class="dropdown-toggle" id="s_notifToggle">
          Notifications <span class="arrow">▼</span>
        </button>
        <div class="dropdown-content" id="s_notifDropdown">
          <label class="toggle-item">
            <input type="checkbox" id="s_notifCheck"> Enable Alerts
          </label>
        </div>
      </div>

      <button id="saveBtn" class="continue-btn">Save →</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
